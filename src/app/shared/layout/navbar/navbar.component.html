<nav class="navbar navbar-expand-lg navbar-custom py-4 bg-white">
    <div class="container-fluid">
        <div class="container-xxl d-flex flex-wrap justify-content-between align-items-center px-0 py-0">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="brand-icon">
                    <img src="images/logo.svg" alt="a•tiempo" class="brand-logo" />
                </div>
            </a>
            <!-- Mobile button -->
            <button class="btn btn-light navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-between bg-whitemt-2 mt-lg-0 pt-3 p-lg-0"
                id="mainNavbar">
                <!-- Menu -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" routerLinkActive="active" [routerLink]="['/home']">Inicio</a>
                    </li>
                    <li class="nav-item">
                        @if (currentUser()) {
                        <a class="nav-link" routerLinkActive="active" [routerLink]="['/explore']">Comprar</a>
                        } @else {
                        <a class="nav-link" routerLinkActive="active" [routerLink]="['/explore']">Explorar</a>
                        }

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLinkActive="active" [routerLink]="['/articles/sell']">Vender</a>
                    </li>           
                    @if (currentUser()?.rol === 'admin') {
                    <li class="nav-item">
                        <a class="nav-link" routerLinkActive="active" [routerLink]="['/admin']">Administrar</a>
                    </li>                       }           
                </ul>

                @if (!currentUser()) {
                <!-- Not logged -->
                <div class="d-flex gap-3 align-items-center">
                    <a routerLink="/register">
                        <app-button [text]="'Crear cuenta'" [class]="'btn-light'" [showIconLeft]="true" [iconLeft]="'bi bi-person-circle'">
                        </app-button>                
                    </a>
                    <a routerLink="/login">
                        <app-button [text]="'Iniciar sesión'" [class]="'btn-primary'" [showIconLeft]="true"
                            [iconLeft]="'bi bi-box-arrow-in-right'">
                        </app-button>
                    </a>
                </div>
                } @else {
                <!-- Logged -->

                <!-- mobile -->
                <div class="d-lg-none d-flex flex-column align-items-center w-100 pb-3 pt-2">

                    <ul class="navbar-nav w-100">
                        <li class="nav-item">
                            <a routerLink="/fav-items" class="nav-link"><i class="bi bi-heart me-2"></i> Mis favoritos</a>
                        </li>

                        <li class="nav-item">
                            <a routerLink="/chats" class="nav-link"><i class="bi bi-envelope me-2"></i> Chats</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"><i class="bi bi-bell me-2"></i>
                                Notificaciones</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-danger" (click)="onLogout()">
                                <i class="bi bi-box-arrow-right me-2 text-danger"></i> Cerrar sesión
                            </a>
                        </li>
                    </ul>
                </div>
                <!-- computer -->
                <div class="d-none d-lg-flex gap-3 align-items-center">
                    <a routerLink="/fav-items">
                        <app-button [class]="'btn-light'" [showIconLeft]="true" [iconLeft]="'bi bi-heart'"></app-button>
                    </a>
                    <a routerLink="/chats">
                        <app-button [class]="'btn-light'" [showIconLeft]="true"
                            [iconLeft]="'bi bi-envelope'"></app-button>
                    </a>
                    <app-button [class]="'btn-light'" [showIconLeft]="true" [iconLeft]="'bi bi-bell'"></app-button>

                    @if (currentUser(); as user) {
                    <a [routerLink]="['/profile', user.fk_usuarios_id]" class="navbar-avatar-link">
                        <app-avatar [name]="user.name" [surname]="user.surname"
                            [photoUrl]="user.photo_url"></app-avatar>
                    </a>
                    <app-button [text]="'Cerrar sesión'" [class]="'btn-outline-primary'" [showIconLeft]="true"
                        [iconLeft]="'bi bi-box-arrow-right'" (click)="onLogout()"></app-button>
                    }
                </div>
                }
            </div>
        </div>
    </div>
</nav>
