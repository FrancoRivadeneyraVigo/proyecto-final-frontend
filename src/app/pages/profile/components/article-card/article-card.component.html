<article class="article-card">
    <div class="article-card-thumbnail">
        <span class="article-card-initials">{{ initials() }}</span>
    </div>

    <div class="article-card-body">
        <div class="article-card-header">
            <h5 class="article-card-title">{{ article().title }}</h5>
            <span class="article-card-badge">{{ statusLabel() }}</span>
        </div>

        <p class="article-card-description body-medium text-muted">{{ article().description }}</p>

        <div class="article-card-actions">
            <app-button [class]="'btn-light'" [showIconLeft]="true" [iconLeft]="'bi bi-pencil'"></app-button>
            <app-button [class]="'btn-light'" [showIconLeft]="true" [iconLeft]="'bi bi-trash'"></app-button>
        </div>
    </div>
</article>
