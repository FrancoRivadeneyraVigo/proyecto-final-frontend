<div class="profile-activity-tabs">
    <nav class="profile-activity-nav">
        <button
            type="button"
            class="profile-activity-nav-link"
            [class.active]="activeTab() === 'articles'"
            (click)="setActiveTab('articles')"
        >
            Artículos
        </button>
        <button
            type="button"
            class="profile-activity-nav-link"
            [class.active]="activeTab() === 'ratings'"
            (click)="setActiveTab('ratings')"
        >
            Valoraciones
        </button>
        @if (isMyProfile()) {
        <button
            type="button"
            class="profile-activity-nav-link"
            [class.active]="activeTab() === 'favorites'"
            (click)="setActiveTab('favorites')"
        >
            Favoritos
        </button>
        }
    </nav>

    <div class="profile-activity-panel">
        @switch (activeTab()) {
            @case ('articles') {
            <app-my-articles [userId]="userId()" [isOwner]="isMyProfile()" />
            }
            @case ('ratings') {
            <app-ratings [reviews]="reviews()" [loading]="loadingActivity()" [error]="activityError()" />
            }
            @case ('favorites') {
            @if (isMyProfile()) {
            <app-favorites [favorites]="favorites()" [loading]="loadingActivity()" [error]="activityError()" (changed)="reloadActivity()" />
            }
            }
        }
    </div>
</div>
