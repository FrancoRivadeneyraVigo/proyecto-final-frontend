<div class="row g-3 mb-4">
    <div class="col-12 col-md-6 col-lg-3">
        <div class="card text-center p-3">
            <h2> {{ publishedArticles() }}</h2>
            <p class="text-muted mb-0">Artículos Publicados</p>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-3">
        <div class="card text-center p-3">
            <h2> {{ soldArticles() }}</h2>
            <p class="text-muted mb-0">Artículos Vendidos</p>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-3">
        <div class="card text-center p-3">
            <h2> {{ activeUsers() }}</h2>
            <p class="text-muted mb-0">Usuarios Activos</p>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-3">
        <div class="card text-center p-3">
            <h2> {{ managedReports() }}</h2>
            <p class="text-muted mb-0">Reportes Gestionados</p>
        </div>
    </div>
</div>
<ag-charts [options]="chartOptions()"> </ag-charts>
